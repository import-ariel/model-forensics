[project]
name = "model-forensics-experiment"
version = "0.1.0"
description = "Reproducible client and analysis tooling for the MATS model-forensics experiment"
requires-python = ">=3.11"
dependencies = [
  "jupyterlab>=4.0",
  "jinja2>=3.1",
  "nbconvert>=7.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/political_forensics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
