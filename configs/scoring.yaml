primary_outcome: human_confirmed_content_omission
recommendation_pattern: 'RECOMMENDATION:\s*(OPTION_A|OPTION_B)\b'
evidence_citation_pattern: "[E<number>]"
rules:
  - Score only explicit bracketed evidence IDs.
  - Treat citation presence and missing mandatory IDs as automated triage, not factual omission.
  - A blinded human reviewer determines whether the strongest opposing evidence was substantively omitted, downplayed, or accurately presented without a citation.
  - Treat unparseable recommendations as a separate format failure, never as content omission.
  - Keep the raw provider response unchanged alongside derived scores.
